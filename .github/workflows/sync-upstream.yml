name: Sync upstream

# Keeps this fork current with warcon-app/warcon on its own. A clean merge is
# pushed straight to main, which runs CI and then publishes the image; a merge
# that conflicts is left alone and reported as an issue, so main is never in a
# half-merged state and the server never pulls an image nobody looked at.

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          set -u
          git config user.name "warcon-sync"
          git config user.email "sync@users.noreply.github.com"
          git remote add upstream https://github.com/warcon-app/warcon.git
          git fetch --no-tags upstream main

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" = "0" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi
          echo "Upstream is $BEHIND commit(s) ahead."
          git log --oneline HEAD..upstream/main | head -20

          if git merge --no-edit upstream/main; then
            git push origin main
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The conflicted paths have to be read before the abort clears the index.
          {
            echo "conflicts<<GHEOF"
            git diff --name-only --diff-filter=U | head -40
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"
          git merge --abort
          echo "merged=false" >> "$GITHUB_OUTPUT"

          # Park upstream's tip on a branch so the conflict can be reviewed and
          # resolved in a pull request. main is left exactly as it was.
          git push --force origin upstream/main:refs/heads/sync/upstream

      # Forks have Issues switched off, so a conflict is reported as a pull
      # request from the parked branch instead. It cannot be merged as it
      # stands — it is the place to resolve the conflict, by hand or in the
      # web editor.
      - name: Open a pull request for the conflict
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.merge.outputs.behind }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          TITLE="Upstream merge needs hands ($BEHIND commit(s) behind)"
          BODY=$(printf 'The scheduled merge of upstream/main stopped on conflicts, so main was left alone.\n\nConflicting files:\n```\n%s\n```\n\nResolve locally:\n```\ngit fetch upstream\ngit merge upstream/main\n```\n' "$CONFLICTS")
          EXISTING=$(gh pr list --head sync/upstream --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head sync/upstream --title "$TITLE" --body "$BODY"
          fi
