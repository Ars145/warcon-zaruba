name: Sync upstream

# The fork's deploy key makes the push trigger CI and permits upstream workflow updates.
# CI gates publication of the image the server pulls. Conflicts require review.

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      - name: Merge upstream/main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "warcon-sync"
          git config user.email "sync@users.noreply.github.com"
          git remote add upstream https://github.com/warcon-app/warcon.git
          git fetch --no-tags upstream main

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" = "0" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi
          echo "Upstream is $BEHIND commit(s) ahead."
          git log -20 --oneline HEAD..upstream/main

          if git merge --no-edit upstream/main; then
            git push origin main
            echo "Merged $BEHIND upstream commit(s). Push starts CI; successful CI publishes the main image." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The conflicted paths have to be read before the abort clears the index.
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          git merge --abort
          {
            echo "### Upstream merge needs review"
            echo "$BEHIND commit(s) behind; main was left untouched."
            printf '\nConflicted files:\n\n%s\n' "$CONFLICTS"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Upstream merge needs hands::$BEHIND commit(s) behind; conflicts in: $(echo "$CONFLICTS" | tr '\n' ' ')"
          echo "Resolve with: git fetch upstream && git merge upstream/main"
          exit 1
