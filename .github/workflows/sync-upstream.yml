name: Sync upstream

# Keeps this fork current with warcon-app/warcon on its own. A clean merge is
# pushed straight to main, which runs CI and then publishes the image; a merge
# that conflicts is left alone and reported as an issue, so main is never in a
# half-merged state and the server never pulls an image nobody looked at.

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          set -u
          git config user.name "warcon-sync"
          git config user.email "sync@users.noreply.github.com"
          git remote add upstream https://github.com/warcon-app/warcon.git
          git fetch --no-tags upstream main

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" = "0" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi
          echo "Upstream is $BEHIND commit(s) ahead."
          git log --oneline HEAD..upstream/main | head -20

          if git merge --no-edit upstream/main; then
            git push origin main
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merged=false" >> "$GITHUB_OUTPUT"
            {
              echo "conflicts<<EOF"
              git diff --name-only --diff-filter=U upstream/main | head -40
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report a conflict
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.merge.outputs.behind }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          TITLE="Upstream merge needs hands ($BEHIND commit(s) behind)"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          BODY=$(printf 'Automatic merge of upstream/main stopped on conflicts.\n\nFiles:\n```\n%s\n```\n\nResolve locally:\n```\ngit fetch upstream\ngit merge upstream/main\n```\n' "$CONFLICTS")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
