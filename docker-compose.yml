# Warcon + TimescaleDB. Runs anywhere that can reach your WARDOGS servers' RCON ports (see README).
#   cp .env.example .env   # set BETTER_AUTH_SECRET, ENCRYPTION_KEY, RELAY_SECRET, POSTGRES_PASSWORD, ORIGIN
#   docker compose up -d   # then open http://<host>:3000
#
# Three containers from one image: `migrate` applies the schema and exits, `warcon` serves the
# panel, `worker` talks to the game servers (observation, triggers, commands relayed from the
# panel). A web deploy never interrupts observation. For the smallest install run one container
# with WARCON_ROLE=all instead (serves, migrates and runs the worker in-process).
x-warcon: &warcon
  build: .
  # image: ghcr.io/<you>/warcon:latest   # use a published image instead of building
  env_file: .env
  environment: &warcon-env
    # The bundled database, as separate fields so POSTGRES_PASSWORD never needs URL-encoding.
    # For an external Postgres set DATABASE_URL in .env instead (it takes precedence) and drop `db`.
    PGHOST: db
    PGPORT: 5432
    PGUSER: warcon
    PGPASSWORD: ${POSTGRES_PASSWORD:-warcon}
    PGDATABASE: warcon
    # The URL people open. Behind a reverse proxy set ORIGIN=https://... and ADDRESS_HEADER in .env (see README).
    ORIGIN: ${ORIGIN:-http://localhost:3000}
    RELAY_URL: http://worker:7700
    # zaruba: couch reserve — the org reserve list; replicated multi-master with the platform's CouchDB.
    COUCH_URL: http://couch:5984
    COUCH_DB: wardogs_reserve
    COUCH_USER: ${COUCH_USER:-warcon}
    COUCH_PASSWORD: ${COUCH_PASSWORD:?set COUCH_PASSWORD in .env}
  # Uncomment to reach an RCON listener bound to 127.0.0.1 on the Docker host:
  # extra_hosts:
  #   - 'host.docker.internal:host-gateway'

services:
  migrate:
    <<: *warcon
    environment:
      <<: *warcon-env
      WARCON_ROLE: migrate
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      couch:
        condition: service_healthy

  warcon:
    <<: *warcon
    environment:
      <<: *warcon-env
      WARCON_ROLE: web
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started

  worker:
    <<: *warcon
    environment:
      <<: *warcon-env
      WARCON_ROLE: worker
      WORKER_PORT: 7700
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: timescale/timescaledb:2.30.0-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: warcon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warcon}
      POSTGRES_DB: warcon
    volumes:
      - warcon-db:/var/lib/postgresql # PostgreSQL 18+ images keep data in a versioned subdirectory here
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warcon -d warcon']
      interval: 5s
      timeout: 5s
      retries: 20

  # zaruba: couch reserve — holds wardogs_reserve (the org reserve list), replicated multi-master
  # with the platform's own CouchDB; the migrate service creates the database and its indexes.
  couch:
    image: couchdb:3.4.3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCH_USER:-warcon}
      COUCHDB_PASSWORD: ${COUCH_PASSWORD:?set COUCH_PASSWORD in .env}
    volumes:
      - couch-data:/opt/couchdb/data
    ports:
      # The host's Caddy proxies /couch/* here for the platform's replicator; see
      # docs/zaruba-couch-reserve.md.
      - '127.0.0.1:5984:5984'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:5984/_up']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  warcon-db:
  couch-data:
